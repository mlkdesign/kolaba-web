<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>kolaba</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; }
  a { color: #ff0077; }
</style>
<script>
  /* GitHub Pages отдаёт эту страницу на любой неизвестный путь.
     Возвращаем пользователя в приложение, сохранив хеш-адрес экрана. */
  (function () {
    var base = location.pathname.replace(/\/[^/]*$/, '/');
    location.replace(base + 'index.html' + location.hash);
  })();
</script>
</head>
<body>
<p>Открываем <a href="./index.html">kolaba</a>…</p>
</body>
</html>
